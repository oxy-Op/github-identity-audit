<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GitHub Identity Audit</title>
<style>:root{font:16px system-ui;color:#16202a;background:#eef2f5}body{max-width:760px;margin:8vh auto;padding:24px}main{background:#fff;padding:32px;border-radius:16px;box-shadow:0 12px 40px #18324b18}label{display:block;font-weight:650;margin:18px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b8c3cc;border-radius:8px}button{margin-top:22px;padding:12px 18px;border:0;border-radius:8px;background:#1769aa;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#status{margin-top:24px;padding:16px;background:#f5f7f9;border-radius:8px;white-space:pre-wrap}.hint{color:#607080;font-size:14px}</style></head>
<body><main><h1>GitHub Identity Audit</h1><p>Local, bounded scan of public GitHub history and authored surfaces.</p><form id="form"><label for="account">GitHub profile URL</label><input id="account" value="https://github.com/example-user?tab=repositories" required><label for="names">Prior names or aliases</label><input id="names" value="Example Name"><p class="hint">Comma-separated. Only values entered here become trusted name seeds.</p><button>Start bounded audit</button></form><div id="status" hidden></div></main>
<script>const form=document.querySelector('#form'),status=document.querySelector('#status'),button=form.querySelector('button');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.hidden=false;status.textContent='Starting…';try{const start=await fetch('/api/audits',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({account:document.querySelector('#account').value,names:document.querySelector('#names').value.split(',').map(x=>x.trim()).filter(Boolean)})}).then(r=>r.json());if(!start.id)throw new Error(start.error||'Could not start');for(;;){const job=await fetch(start.statusUrl).then(r=>r.json());status.textContent=`${job.status}\n${job.progress||''}`;if(job.status==='completed'){status.innerHTML=`Completed. <a href="/api/audits/${job.id}/report">Open JSON report</a>`;break}if(job.status==='failed')throw new Error(job.error);await new Promise(r=>setTimeout(r,1500))}}catch(error){status.textContent='Failed: '+error.message}finally{button.disabled=false}})</script></body></html>
